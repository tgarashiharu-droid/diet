<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コンビニ3社 1日献立レシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF7EE;
    --counter-bg: #DCE6EC;
    --ink: #212A33;
    --ink-soft: #6B7580;
    --brand: #2B7A4B;
    --brand-sky: #7FD1A0;
    --stamp: #B23A2E;
    --line: #C9CBB8;
    --seven-orange: #EE7203;
    --lawson-blue: #0056A8;
    --family-green: #00A650;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--counter-bg);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.35), transparent 40%);
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--ink);
  }
  .stage{ max-width: 460px; margin: 0 auto; padding: 28px 14px 60px; }
  .app-title{
    text-align:center; font-family:'Zen Maru Gothic', sans-serif; font-weight:900;
    font-size: 15px; letter-spacing: 0.1em; color: var(--brand); margin: 0 0 4px;
  }
  .app-sub{ text-align:center; font-size:11.5px; color: var(--ink-soft); margin: 0 0 22px; letter-spacing:0.03em; }
  .config-warning{
    background:#FFF3E0; border:1px solid #F0B24C; color:#8A5A00;
    border-radius:10px; padding:10px 12px; font-size:11.5px; line-height:1.6;
    margin-bottom:16px; text-align:center;
  }

  .controls{
    background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.06);
    border-radius: 14px; padding: 14px; margin-bottom: 20px;
  }
  .row{ display:flex; gap:8px; margin-bottom: 10px; }
  .row:last-child{ margin-bottom:0; }
  .budget-wrap{
    display:flex; align-items:center; flex:1; background:white;
    border:1.5px solid var(--line); border-radius:10px; padding: 6px 10px; gap:6px;
  }
  .budget-wrap span{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .budget-wrap input{
    border:none; outline:none; width:100%; font-family:'JetBrains Mono', monospace;
    font-size:15px; font-weight:700; color:var(--ink); background:transparent;
  }
  .macro-preview{
    display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace; padding: 2px 4px 8px;
  }
  .macro-preview b{ color:var(--ink); }
  .generate-btn{
    width:100%; padding: 13px; border-radius: 10px; border: none;
    background: var(--brand); color:white; font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700; font-size: 14.5px; letter-spacing: 0.05em; cursor:pointer;
    box-shadow: 0 3px 0 #1c5535; transition: transform .08s ease;
  }
  .generate-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 #1c5535; }
  .generate-btn:disabled{ opacity:0.6; cursor:default; box-shadow:none; }

  .receipt-wrap{ position:relative; margin: 26px 0 10px; }
  .zigzag-top, .zigzag-bottom{
    height: 11px;
    background-image:
      linear-gradient(45deg, transparent 33.4%, var(--paper) 33.4% 66.6%, transparent 66.6%),
      linear-gradient(-45deg, transparent 33.4%, var(--paper) 33.4% 66.6%, transparent 66.6%);
    background-size: 16px 16px; background-position: left top;
  }
  .zigzag-bottom{ transform: scaleY(-1); }
  .receipt{
    background: var(--paper); padding: 22px 20px 18px; font-family:'JetBrains Mono', monospace;
    box-shadow: 0 10px 24px rgba(0,0,0,0.12); position:relative;
  }
  .receipt-band{
    height: 6px; margin: -22px -20px 14px;
    background: repeating-linear-gradient(
      to right,
      var(--seven-orange) 0 9px, white 9px 12px,
      var(--lawson-blue) 12px 21px, white 21px 24px,
      var(--family-green) 24px 33px, white 33px 36px
    );
  }
  .r-store{
    text-align:center; font-family:'Zen Maru Gothic', sans-serif; font-weight:900;
    font-size: 17px; color: var(--brand); letter-spacing: 0.04em; margin-bottom: 2px;
  }
  .r-meta{ text-align:center; font-size: 10.5px; color: var(--ink-soft); margin-bottom: 12px; line-height:1.6; }
  .r-day{
    display:inline-block; border:1px solid var(--ink-soft); border-radius:3px;
    padding:1px 6px; margin-top:3px; font-size:10px;
  }
  .r-divider{ border:none; border-top: 1.5px dashed var(--line); margin: 10px 0; }
  .meal-head{
    font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size: 13.5px;
    color: var(--brand); margin: 14px 0 8px; display:flex; align-items:center; gap:6px;
  }
  .meal-head:first-of-type{ margin-top: 4px; }
  .r-item{ display:flex; align-items:baseline; font-size: 12.5px; margin-bottom: 7px; }
  .store-tag{
    flex-shrink:0; width:16px; height:16px; border-radius:4px; color:white;
    font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center;
    margin-right:6px; font-family:'Zen Maru Gothic', sans-serif;
  }
  .store-tag.s7{ background: var(--seven-orange); }
  .store-tag.sL{ background: var(--lawson-blue); }
  .store-tag.sF{ background: var(--family-green); }
  .r-item .name{ flex-shrink:0; max-width:52%; }
  .r-item .dots{ flex:1; border-bottom: 1px dotted var(--ink-soft); margin: 0 6px 3px; height: 1px; }
  .r-item .price{ flex-shrink:0; font-weight:700; }

  .macro-table{ width:100%; border-collapse: collapse; font-size: 11.5px; margin: 10px 0 4px; }
  .macro-table th{ text-align:right; color: var(--ink-soft); font-weight:400; padding: 3px 4px; }
  .macro-table th:first-child{ text-align:left; }
  .macro-table td{ text-align:right; padding: 3px 4px; font-weight:700; }
  .macro-table td:first-child{ text-align:left; font-weight:400; color: var(--ink-soft); }
  .macro-table tr.total-row td{ border-top: 1.5px solid var(--ink); padding-top:6px; }

  .r-total{
    display:flex; justify-content:space-between; align-items:center; font-size: 17px; font-weight:700;
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 8px 0; margin: 12px 0 10px;
  }
  .r-tip{
    background: rgba(43,122,75,0.08); border-radius: 8px; padding: 10px 12px;
    font-family:'Noto Sans JP', sans-serif; font-size: 12px; line-height:1.6; color: var(--ink); margin-top: 6px;
  }
  .r-tip b{ color: var(--brand); }
  .barcode{
    height: 34px; margin: 16px 0 6px;
    background: repeating-linear-gradient(
      to right,
      var(--ink) 0 2px, transparent 2px 3px,
      var(--ink) 3px 4px, transparent 4px 7px,
      var(--ink) 7px 10px, transparent 10px 12px,
      var(--ink) 12px 13px, transparent 13px 17px
    );
  }
  .r-thanks{ text-align:center; font-size: 10.5px; color: var(--ink-soft); letter-spacing: 0.08em; }

  .empty-state, .error-state{ text-align:center; padding: 40px 16px; color: var(--ink-soft); font-size: 13px; line-height:1.8; }
  .loading{ text-align:center; padding: 46px 16px; font-family:'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-soft); }
  .dots-anim span{ animation: blink 1.2s infinite; opacity:0; }
  .dots-anim span:nth-child(2){ animation-delay: .2s; }
  .dots-anim span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink{ 0%,100%{opacity:0;} 50%{opacity:1;} }

  .history-head{ display:flex; justify-content:space-between; align-items:center; margin: 30px 4px 10px; }
  .history-head h2{ font-family:'Zen Maru Gothic', sans-serif; font-size: 13px; font-weight:700; color: var(--ink-soft); margin:0; letter-spacing:0.05em; }
  .clear-btn{ background:none; border:none; color: var(--stamp); font-size: 11.5px; text-decoration: underline; cursor:pointer; }
  .history-stack{ display:flex; flex-direction:column; gap:8px; }
  .history-card{
    background: var(--paper); border-radius: 4px; padding: 10px 14px; box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    font-family:'JetBrains Mono', monospace; font-size: 11.5px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; border-left: 3px solid var(--brand);
  }
  .history-card .h-left{ font-family:'Noto Sans JP', sans-serif; }
  .history-card .h-price{ font-weight:700; }
</style>
</head>
<body>
<div class="stage">
  <p class="app-title">CONVENI DAILY RECEIPT</p>
  <p class="app-sub">セブン-イレブン / ローソン / ファミリーマート対応・1日分の献立を発行</p>

  <div id="configWarning" class="config-warning" style="display:none;">
    ⚠️ WORKER_URL が未設定です。下の方の <code>const WORKER_URL = "..."</code> を、あなたのCloudflare WorkerのURLに書き換えてください。
  </div>

  <div class="controls">
    <div class="row">
      <div class="budget-wrap">
        <span>目標カロリー</span>
        <input type="number" id="kcalInput" value="1700" min="1200" max="2500" step="10">
        <span>kcal</span>
      </div>
    </div>
    <div class="macro-preview" id="macroPreview"></div>
    <div class="row">
      <button class="generate-btn" id="genBtn">🧾 本日の1日分を発行する</button>
    </div>
  </div>

  <div id="output">
    <div class="empty-state">「本日の1日分を発行する」を押すと<br>3社のコンビニで買える1日分の献立が届きます。</div>
  </div>

  <div class="history-head">
    <h2>これまでの献立</h2>
    <button class="clear-btn" id="clearBtn">履歴を消す</button>
  </div>
  <div class="history-stack" id="historyStack"></div>
</div>

<script>
// =====================================================
// ここをあなたのCloudflare WorkerのURLに書き換えてください
// 例: "https://lawson-meal-api.your-subdomain.workers.dev"
// (前回作ったWorkerをそのまま使い回せます)
// =====================================================
const WORKER_URL = "https://tommydietplan.tgarashiharu.workers.dev";

const PROFILE = {
  age: 26, heightCm: 174, weightKg: 80,
  goal: "4ヶ月で15kg減量中のダイエット",
  ban: "白米は禁止(玄米・もち麦入りはOK)"
};

// 固定PFC比率(たんぱく質20% / 脂質25% / 炭水化物55%)
const RATIO = { protein: 0.20, fat: 0.25, carb: 0.55 };

let history = [];

const outputEl = document.getElementById('output');
const historyStackEl = document.getElementById('historyStack');
const genBtn = document.getElementById('genBtn');
const kcalInput = document.getElementById('kcalInput');
const clearBtn = document.getElementById('clearBtn');
const configWarningEl = document.getElementById('configWarning');
const macroPreviewEl = document.getElementById('macroPreview');

if (!WORKER_URL || WORKER_URL.indexOf('http') !== 0) {
  configWarningEl.style.display = 'block';
}

function computeTargets(kcal){
  return {
    kcal,
    protein: Math.round(kcal * RATIO.protein / 4),
    fat: Math.round(kcal * RATIO.fat / 9),
    carb: Math.round(kcal * RATIO.carb / 4)
  };
}

function renderMacroPreview(){
  const kcal = parseInt(kcalInput.value, 10) || 1700;
  const t = computeTargets(kcal);
  macroPreviewEl.innerHTML = `目標内訳: P<b>${t.protein}g</b> / F<b>${t.fat}g</b> / C<b>${t.carb}g</b>`;
}
kcalInput.addEventListener('input', renderMacroPreview);
renderMacroPreview();

// このファイルはClaude.aiのアーティファクトの外(GitHub Pagesなど)で動かす前提のため、
// window.storage ではなく通常の localStorage を使って履歴を保存します。
function loadHistory(){
  try{
    const raw = localStorage.getItem('conbini_daily_history');
    history = raw ? JSON.parse(raw) : [];
  }catch(e){
    history = [];
  }
  renderHistory();
}

function saveHistory(){
  try{
    localStorage.setItem('conbini_daily_history', JSON.stringify(history));
  }catch(e){
    console.error('history save failed', e);
  }
}

function renderHistory(){
  if(history.length === 0){
    historyStackEl.innerHTML = '<div class="empty-state" style="padding:14px;">まだ履歴がありません</div>';
    return;
  }
  historyStackEl.innerHTML = history.slice(0, 14).map((h, idx) => `
    <div class="history-card" data-idx="${idx}">
      <div class="h-left">DAY ${String(h.dayCount).padStart(3,'0')} ・ ${h.totalCalories}kcal</div>
      <div class="h-price">¥${h.totalPrice}</div>
    </div>
  `).join('');
  [...historyStackEl.querySelectorAll('.history-card')].forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.idx, 10);
      renderReceipt(history[idx]);
    });
  });
}

function extractJson(text){
  let t = text.trim();
  t = t.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  return JSON.parse(t);
}

function storeTagClass(store){
  if(store.includes('セブン')) return 's7';
  if(store.includes('ローソン')) return 'sL';
  if(store.includes('ファミ')) return 'sF';
  return 's7';
}
function storeTagLabel(store){
  if(store.includes('セブン')) return '7';
  if(store.includes('ローソン')) return 'L';
  if(store.includes('ファミ')) return 'F';
  return '?';
}

async function generatePlan(){
  if (!WORKER_URL || WORKER_URL.indexOf('http') !== 0) {
    configWarningEl.style.display = 'block';
    return;
  }

  genBtn.disabled = true;
  const kcal = parseInt(kcalInput.value, 10) || 1700;
  const targets = computeTargets(kcal);
  outputEl.innerHTML = `<div class="loading">レシート印字中<span class="dots-anim"><span>.</span><span>.</span><span>.</span></span></div>`;

  const recentItems = history.slice(0, 5)
    .flatMap(h => h.meals.flatMap(m => m.items.map(i => i.name)))
    .join('、') || 'なし';

  const prompt = `あなたは日本のコンビニ(セブン-イレブン、ローソン、ファミリーマートの3社)の商品だけを使って、ダイエット中の人のための1日分の食事プランを提案する栄養アドバイザーです。

【ユーザー情報】
- ${PROFILE.age}歳男性、身長${PROFILE.heightCm}cm、体重${PROFILE.weightKg}kg、${PROFILE.goal}
- ${PROFILE.ban}

【今回の目標(1日合計)】
- 摂取カロリー: 約${targets.kcal}kcal
- タンパク質: 約${targets.protein}g(20%)
- 脂質: 約${targets.fat}g(25%)
- 炭水化物: 約${targets.carb}g(55%)
- 朝食・昼食・間食・夕食の4食に分けて構成する
- 各商品は実在しそうなセブン-イレブン/ローソン/ファミリーマートの商品名・概算価格を使い、必ずどの店の商品か明記する(3社をバランスよく使ってよい)
- なるべく安く抑える
- 直近の提案とはなるべく被らない組み合わせにする。直近の提案商品: ${recentItems}

以下のJSON形式のみで回答してください。前置き・説明・Markdown装飾は一切不要です。

{
  "meals": [
    { "mealName": "朝食", "items": [{"store":"セブン-イレブン","name":"商品名","price":数値,"calories":数値,"protein":数値,"fat":数値,"carbs":数値}] },
    { "mealName": "昼食", "items": [...] },
    { "mealName": "間食", "items": [...] },
    { "mealName": "夕食", "items": [...] }
  ],
  "totalPrice": 数値,
  "totalCalories": 数値,
  "totalProtein": 数値,
  "totalFat": 数値,
  "totalCarbs": 数値,
  "tip": "20〜40文字程度の短いアドバイス"
}`;

  try{
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, maxTokens: 1600 })
    });

    const data = await response.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');

    const plan = extractJson(data.text);

    const entry = {
      id: Date.now(),
      date: new Date().toLocaleDateString('ja-JP', { month:'2-digit', day:'2-digit', weekday:'short' }),
      time: new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' }),
      dayCount: history.length + 1,
      targetKcal: targets.kcal,
      targetProtein: targets.protein,
      targetFat: targets.fat,
      targetCarb: targets.carb,
      meals: plan.meals,
      totalPrice: plan.totalPrice,
      totalCalories: plan.totalCalories,
      totalProtein: plan.totalProtein,
      totalFat: plan.totalFat,
      totalCarbs: plan.totalCarbs,
      tip: plan.tip
    };

    history.unshift(entry);
    saveHistory();
    renderReceipt(entry);
    renderHistory();
  }catch(err){
    console.error(err);
    const detail = (err && err.message) ? err.message : String(err);
    outputEl.innerHTML = `<div class="error-state">レシートを発行できませんでした。<br>もう一度お試しください。<br><span style="font-size:10.5px;opacity:0.7;">(詳細: ${detail})</span></div>`;
  }finally{
    genBtn.disabled = false;
  }
}

function renderReceipt(entry){
  const mealsHtml = entry.meals.map(m => `
    <div class="meal-head">${m.mealName}</div>
    ${m.items.map(i => `
      <div class="r-item">
        <span class="store-tag ${storeTagClass(i.store)}">${storeTagLabel(i.store)}</span>
        <span class="name">${i.name}</span>
        <span class="dots"></span>
        <span class="price">¥${i.price}</span>
      </div>
    `).join('')}
  `).join('');

  outputEl.innerHTML = `
    <div class="receipt-wrap">
      <div class="zigzag-top"></div>
      <div class="receipt">
        <div class="receipt-band"></div>
        <div class="r-store">CONVENI DAILY</div>
        <div class="r-meta">
          ${entry.date} ${entry.time} 発行<br>
          <span class="r-day">DAY ${String(entry.dayCount).padStart(3,'0')}</span>
        </div>
        <hr class="r-divider">
        ${mealsHtml}
        <hr class="r-divider">
        <table class="macro-table">
          <tr><th></th><th>目標</th><th>実際</th></tr>
          <tr><td>カロリー</td><td>${entry.targetKcal}</td><td>${entry.totalCalories}</td></tr>
          <tr><td>タンパク質</td><td>${entry.targetProtein}g</td><td>${entry.totalProtein}g</td></tr>
          <tr><td>脂質</td><td>${entry.targetFat}g</td><td>${entry.totalFat}g</td></tr>
          <tr class="total-row"><td>炭水化物</td><td>${entry.targetCarb}g</td><td>${entry.totalCarbs}g</td></tr>
        </table>
        <div class="r-total"><span>合計金額</span><span>¥${entry.totalPrice}</span></div>
        <div class="r-tip"><b>ひとことアドバイス:</b> ${entry.tip}</div>
        <div class="barcode"></div>
        <div class="r-thanks">ありがとうございました またお越しください</div>
      </div>
      <div class="zigzag-bottom"></div>
    </div>
  `;
}

clearBtn.addEventListener('click', () => {
  history = [];
  saveHistory();
  renderHistory();
  outputEl.innerHTML = `<div class="empty-state">「本日の1日分を発行する」を押すと<br>3社のコンビニで買える1日分の献立が届きます。</div>`;
});

genBtn.addEventListener('click', generatePlan);

loadHistory();
</script>
</body>
</html>
