<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コンビニ献立バランサー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF7EE;
    --counter-bg: #DCE6EC;
    --ink: #212A33;
    --ink-soft: #6B7580;
    --brand: #2B7A4B;
    --stamp: #B23A2E;
    --line: #C9CBB8;
    --seven-orange: #EE7203;
    --lawson-blue: #0056A8;
    --family-green: #00A650;
    --advice-bg: rgba(43,122,75,0.08);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--counter-bg);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.35), transparent 40%);
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--ink);
  }
  .stage{ max-width: 460px; margin: 0 auto; padding: 28px 14px 60px; }
  .app-title{
    text-align:center; font-family:'Zen Maru Gothic', sans-serif; font-weight:900;
    font-size: 15px; letter-spacing: 0.1em; color: var(--brand); margin: 0 0 4px;
  }
  .app-sub{ text-align:center; font-size:11.5px; color: var(--ink-soft); margin: 0 0 22px; letter-spacing:0.03em; }
  .config-warning{
    background:#FFF3E0; border:1px solid #F0B24C; color:#8A5A00;
    border-radius:10px; padding:10px 12px; font-size:11.5px; line-height:1.6;
    margin-bottom:16px; text-align:center;
  }

  .controls{
    background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.06);
    border-radius: 14px; padding: 14px; margin-bottom: 20px;
  }
  .field-label{ font-size:11px; color:var(--ink-soft); margin: 0 2px 6px; letter-spacing:0.03em; }
  .row{ display:flex; gap:8px; margin-bottom: 12px; }
  .row:last-child{ margin-bottom:0; }
  .choice-btn{
    flex:1; padding: 9px 4px; border-radius: 10px; border: 1.5px solid var(--brand);
    background: white; color: var(--brand); font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700; font-size: 12.5px; cursor:pointer; transition: all .15s ease;
  }
  .choice-btn.active{ background: var(--brand); color: white; }
  .choice-btn.store-seven{ border-color: var(--seven-orange); color: var(--seven-orange); }
  .choice-btn.store-seven.active{ background: var(--seven-orange); color:white; }
  .choice-btn.store-lawson{ border-color: var(--lawson-blue); color: var(--lawson-blue); }
  .choice-btn.store-lawson.active{ background: var(--lawson-blue); color:white; }
  .choice-btn.store-family{ border-color: var(--family-green); color: var(--family-green); }
  .choice-btn.store-family.active{ background: var(--family-green); color:white; }

  .budget-wrap{
    display:flex; align-items:center; flex:1; background:white;
    border:1.5px solid var(--line); border-radius:10px; padding: 6px 10px; gap:6px;
  }
  .budget-wrap span{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .budget-wrap input{
    border:none; outline:none; width:100%; font-family:'JetBrains Mono', monospace;
    font-size:15px; font-weight:700; color:var(--ink); background:transparent;
  }
  .daily-target-toggle{
    font-size:11px; color:var(--brand); text-decoration:underline; cursor:pointer;
    text-align:right; margin: -4px 2px 10px;
  }
  .daily-target-box{ display:none; }
  .daily-target-box.open{ display:block; }
  .macro-preview{
    display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace; padding: 2px 4px 10px;
  }
  .macro-preview b{ color:var(--ink); }
  .generate-btn{
    width:100%; padding: 13px; border-radius: 10px; border: none;
    background: var(--brand); color:white; font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700; font-size: 14.5px; letter-spacing: 0.05em; cursor:pointer;
    box-shadow: 0 3px 0 #1c5535; transition: transform .08s ease;
  }
  .generate-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 #1c5535; }
  .generate-btn:disabled{ opacity:0.6; cursor:default; box-shadow:none; }

  .receipt-wrap{ position:relative; margin: 26px 0 10px; }
  .zigzag-top, .zigzag-bottom{
    height: 11px;
    background-image:
      linear-gradient(45deg, transparent 33.4%, var(--paper) 33.4% 66.6%, transparent 66.6%),
      linear-gradient(-45deg, transparent 33.4%, var(--paper) 33.4% 66.6%, transparent 66.6%);
    background-size: 16px 16px; background-position: left top;
  }
  .zigzag-bottom{ transform: scaleY(-1); }
  .receipt{
    background: var(--paper); padding: 22px 20px 18px; font-family:'JetBrains Mono', monospace;
    box-shadow: 0 10px 24px rgba(0,0,0,0.12); position:relative;
  }
  .receipt-band{ height: 6px; margin: -22px -20px 14px; }
  .receipt-band.s7{ background: repeating-linear-gradient(to right, var(--seven-orange) 0 12px, white 12px 16px, #2E9E4F 16px 28px, white 28px 32px, #E60012 32px 44px, white 44px 48px); }
  .receipt-band.sL{ background: repeating-linear-gradient(to right, var(--lawson-blue) 0 10px, white 10px 14px, #6FC6E8 14px 24px, white 24px 28px); }
  .receipt-band.sF{ background: repeating-linear-gradient(to right, var(--family-green) 0 10px, white 10px 14px, var(--lawson-blue) 14px 24px, white 24px 28px); }
  .r-store{
    text-align:center; font-family:'Zen Maru Gothic', sans-serif; font-weight:900;
    font-size: 18px; margin-bottom: 2px;
  }
  .r-meta{ text-align:center; font-size: 10.5px; color: var(--ink-soft); margin-bottom: 12px; line-height:1.6; }
  .r-day{
    display:inline-block; border:1px solid var(--ink-soft); border-radius:3px;
    padding:1px 6px; margin-top:3px; font-size:10px;
  }
  .r-divider{ border:none; border-top: 1.5px dashed var(--line); margin: 12px 0; }
  .stamp{
    position:absolute; top: 54px; right: 18px;
    border: 3px solid var(--stamp); color: var(--stamp); border-radius: 8px;
    padding: 3px 8px; font-family:'Zen Maru Gothic', sans-serif; font-weight:900;
    font-size: 13px; transform: rotate(-11deg); opacity: 0.85;
  }
  .r-item{ display:flex; align-items:baseline; font-size: 13px; margin-bottom: 9px; }
  .r-item .name{ flex-shrink:0; max-width:60%; }
  .r-item .dots{ flex:1; border-bottom: 1px dotted var(--ink-soft); margin: 0 6px 3px; height: 1px; }
  .r-item .price{ flex-shrink:0; font-weight:700; }

  .pfc-row{
    display:flex; justify-content:space-around; text-align:center;
    background: rgba(0,0,0,0.03); border-radius:8px; padding: 10px 4px; margin: 10px 0;
  }
  .pfc-item .val{ font-size:16px; font-weight:700; color:var(--ink); }
  .pfc-item .lbl{ font-size:10px; color:var(--ink-soft); }

  .r-total{
    display:flex; justify-content:space-between; align-items:center; font-size: 17px; font-weight:700;
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 8px 0; margin: 12px 0 10px;
  }
  .advice-box{
    background: var(--advice-bg); border-radius: 8px; padding: 12px 13px;
    font-family:'Noto Sans JP', sans-serif; font-size: 12.5px; line-height:1.7; color: var(--ink); margin-top: 10px;
  }
  .advice-box .advice-head{ font-weight:700; color: var(--brand); margin-bottom:4px; display:block; }
  .today-progress{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft);
    margin-top:8px; line-height:1.7;
  }
  .barcode{
    height: 34px; margin: 16px 0 6px;
    background: repeating-linear-gradient(
      to right,
      var(--ink) 0 2px, transparent 2px 3px,
      var(--ink) 3px 4px, transparent 4px 7px,
      var(--ink) 7px 10px, transparent 10px 12px,
      var(--ink) 12px 13px, transparent 13px 17px
    );
  }
  .r-thanks{ text-align:center; font-size: 10.5px; color: var(--ink-soft); letter-spacing: 0.08em; }

  .empty-state, .error-state{ text-align:center; padding: 40px 16px; color: var(--ink-soft); font-size: 13px; line-height:1.8; }
  .loading{ text-align:center; padding: 46px 16px; font-family:'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-soft); }
  .dots-anim span{ animation: blink 1.2s infinite; opacity:0; }
  .dots-anim span:nth-child(2){ animation-delay: .2s; }
  .dots-anim span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink{ 0%,100%{opacity:0;} 50%{opacity:1;} }

  .history-head{ display:flex; justify-content:space-between; align-items:center; margin: 30px 4px 10px; }
  .history-head h2{ font-family:'Zen Maru Gothic', sans-serif; font-size: 13px; font-weight:700; color: var(--ink-soft); margin:0; letter-spacing:0.05em; }
  .clear-btn{ background:none; border:none; color: var(--stamp); font-size: 11.5px; text-decoration: underline; cursor:pointer; }
  .history-stack{ display:flex; flex-direction:column; gap:8px; }
  .history-card{
    background: var(--paper); border-radius: 4px; padding: 10px 14px; box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    font-family:'JetBrains Mono', monospace; font-size: 11.5px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; border-left: 3px solid var(--brand);
  }
  .history-card .h-left{ font-family:'Noto Sans JP', sans-serif; }
  .history-card .h-meal{ color:var(--ink-soft); font-size:10px; margin-right:6px;}
  .history-card .h-price{ font-weight:700; }
</style>
</head>
<body>
<div class="stage">
  <p class="app-title">CONVENI MEAL BALANCER</p>
  <p class="app-sub">お店・時間帯・予算を選んで1食を発行。残りの食事のバランスも提案します</p>

  <div id="configWarning" class="config-warning" style="display:none;">
    ⚠️ WORKER_URL が未設定です。下の方の <code>const WORKER_URL = "..."</code> を、あなたのCloudflare WorkerのURLに書き換えてください。
  </div>

  <div class="controls">
    <p class="field-label">コンビニ</p>
    <div class="row" id="storeRow">
      <button class="choice-btn store-seven active" data-store="セブン-イレブン">セブン</button>
      <button class="choice-btn store-lawson" data-store="ローソン">ローソン</button>
      <button class="choice-btn store-family" data-store="ファミリーマート">ファミマ</button>
    </div>

    <p class="field-label">時間帯</p>
    <div class="row" id="slotRow">
      <button class="choice-btn active" data-slot="朝食">朝食</button>
      <button class="choice-btn" data-slot="昼食">昼食</button>
      <button class="choice-btn" data-slot="夕食">夕食</button>
    </div>

    <p class="field-label">予算</p>
    <div class="row">
      <div class="budget-wrap">
        <span>上限</span>
        <input type="number" id="priceInput" value="500" min="0" step="10">
        <span>円</span>
      </div>
    </div>

    <div class="daily-target-toggle" id="targetToggle">1日の目標を設定する ▾</div>
    <div class="daily-target-box" id="targetBox">
      <div class="row">
        <div class="budget-wrap">
          <span>1日の目標カロリー</span>
          <input type="number" id="kcalInput" value="1700" min="1200" max="2500" step="10">
          <span>kcal</span>
        </div>
      </div>
      <div class="macro-preview" id="macroPreview"></div>
    </div>

    <div class="row">
      <button class="generate-btn" id="genBtn">🧾 この食事を発行する</button>
    </div>
  </div>

  <div id="output">
    <div class="empty-state">お店・時間帯・予算を選んで<br>「この食事を発行する」を押してください。</div>
  </div>

  <div class="history-head">
    <h2>本日ここまで</h2>
    <button class="clear-btn" id="clearBtn">本日の記録をリセット</button>
  </div>
  <div class="history-stack" id="historyStack"></div>
</div>

<script>
// =====================================================
// ここをあなたのCloudflare WorkerのURLに書き換えてください
// =====================================================
const WORKER_URL = "https://tommydietplan.tgarashiharu.workers.dev";

const PROFILE = {
  age: 26, heightCm: 174, weightKg: 80,
  goal: "4ヶ月で15kg減量中のダイエット",
  ban: "白米は禁止(玄米・もち麦入りはOK)"
};

// 固定PFC比率(たんぱく質20% / 脂質25% / 炭水化物55%)
const RATIO = { protein: 0.20, fat: 0.25, carb: 0.55 };
const MEAL_SLOTS = ["朝食", "昼食", "夕食"];

let selectedStore = "セブン-イレブン";
let selectedSlot = "朝食";
let todayLog = { date: "", meals: {} }; // { 朝食: entry|undefined, 昼食: ..., 夕食: ... }

const outputEl = document.getElementById('output');
const historyStackEl = document.getElementById('historyStack');
const genBtn = document.getElementById('genBtn');
const kcalInput = document.getElementById('kcalInput');
const priceInput = document.getElementById('priceInput');
const storeRow = document.getElementById('storeRow');
const slotRow = document.getElementById('slotRow');
const clearBtn = document.getElementById('clearBtn');
const configWarningEl = document.getElementById('configWarning');
const macroPreviewEl = document.getElementById('macroPreview');
const targetToggle = document.getElementById('targetToggle');
const targetBox = document.getElementById('targetBox');

if (!WORKER_URL || WORKER_URL.indexOf('http') !== 0) {
  configWarningEl.style.display = 'block';
}

targetToggle.addEventListener('click', () => {
  targetBox.classList.toggle('open');
  targetToggle.textContent = targetBox.classList.contains('open') ? '1日の目標を閉じる ▴' : '1日の目標を設定する ▾';
});

storeRow.addEventListener('click', (e) => {
  const btn = e.target.closest('.choice-btn');
  if(!btn) return;
  [...storeRow.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedStore = btn.dataset.store;
});

slotRow.addEventListener('click', (e) => {
  const btn = e.target.closest('.choice-btn');
  if(!btn) return;
  [...slotRow.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedSlot = btn.dataset.slot;
});

function computeTargets(kcal){
  return {
    kcal,
    protein: Math.round(kcal * RATIO.protein / 4),
    fat: Math.round(kcal * RATIO.fat / 9),
    carb: Math.round(kcal * RATIO.carb / 4)
  };
}

function renderMacroPreview(){
  const kcal = parseInt(kcalInput.value, 10) || 1700;
  const t = computeTargets(kcal);
  macroPreviewEl.innerHTML = `1日の目標内訳: P<b>${t.protein}g</b> / F<b>${t.fat}g</b> / C<b>${t.carb}g</b>`;
}
kcalInput.addEventListener('input', renderMacroPreview);
renderMacroPreview();

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit' });
}

function loadTodayLog(){
  try{
    const raw = localStorage.getItem('conveni_today_log');
    const parsed = raw ? JSON.parse(raw) : null;
    if(parsed && parsed.date === todayStr()){
      todayLog = parsed;
    }else{
      todayLog = { date: todayStr(), meals: {} };
    }
  }catch(e){
    todayLog = { date: todayStr(), meals: {} };
  }
  renderHistory();
}

function saveTodayLog(){
  try{
    localStorage.setItem('conveni_today_log', JSON.stringify(todayLog));
  }catch(e){
    console.error('save failed', e);
  }
}

function renderHistory(){
  const filled = MEAL_SLOTS.filter(s => todayLog.meals[s]);
  if(filled.length === 0){
    historyStackEl.innerHTML = '<div class="empty-state" style="padding:14px;">まだ本日の記録はありません</div>';
    return;
  }
  historyStackEl.innerHTML = filled.map(slot => {
    const m = todayLog.meals[slot];
    return `
      <div class="history-card" data-slot="${slot}">
        <div class="h-left"><span class="h-meal">${slot}</span>${m.store} ・ ${m.totalCalories}kcal</div>
        <div class="h-price">¥${m.totalPrice}</div>
      </div>
    `;
  }).join('');
  [...historyStackEl.querySelectorAll('.history-card')].forEach(card => {
    card.addEventListener('click', () => {
      renderReceipt(todayLog.meals[card.dataset.slot], card.dataset.slot);
    });
  });
}

function extractJson(text){
  let t = text.trim();
  t = t.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  return JSON.parse(t);
}

function sumTodayMacros(excludeSlot){
  const totals = { kcal:0, protein:0, fat:0, carb:0, price:0 };
  MEAL_SLOTS.forEach(slot => {
    if(slot === excludeSlot) return;
    const m = todayLog.meals[slot];
    if(m){
      totals.kcal += m.totalCalories;
      totals.protein += m.totalProtein;
      totals.fat += m.totalFat;
      totals.carb += m.totalCarbs;
      totals.price += m.totalPrice;
    }
  });
  return totals;
}

function buildAdvice(targets, mealSlot){
  const consumed = sumTodayMacros(null); // 今回生成した分も含めた本日合計
  const remaining = {
    kcal: targets.kcal - consumed.kcal,
    protein: targets.protein - consumed.protein,
    fat: targets.fat - consumed.fat,
    carb: targets.carb - consumed.carb
  };
  const remainingSlots = MEAL_SLOTS.filter(s => !todayLog.meals[s]);

  let nextLabel = '残りの食事';
  if(remainingSlots.includes('夕食') && mealSlot !== '夕食') nextLabel = '夜';
  else if(remainingSlots.includes('昼食') && mealSlot === '朝食') nextLabel = '昼';

  let headline, body;

  if(remainingSlots.length === 0){
    // 3食すべて記録済み
    if(remaining.kcal < -100){
      headline = '本日は目標を少しオーバーしています';
      body = `カロリーが目標より約${Math.abs(Math.round(remaining.kcal))}kcal多めです。明日は少し軽めを意識するとバランスが取れます。`;
    }else if(remaining.kcal > 200){
      headline = '本日はまだ少し余裕があります';
      body = `あと約${Math.round(remaining.kcal)}kcal・タンパク質約${Math.max(Math.round(remaining.protein),0)}g分の余裕があります。小腹が空いたら軽い間食を追加してもOKです。`;
    }else{
      headline = '本日の食事は良いバランスでした';
      body = `目標に近いカロリー・PFCで1日を終えられそうです。`;
    }
  }else{
    const remKcal = Math.max(remaining.kcal, 1);
    const proteinShare = (remaining.protein * 4) / remKcal;
    const fatShare = (remaining.fat * 9) / remKcal;

    if(remaining.kcal <= 100){
      headline = `${nextLabel}は軽めがおすすめ`;
      body = `残りのカロリー枠が少ないです(目安 約${Math.max(Math.round(remaining.kcal),0)}kcal)。サラダやスープなど軽いメニューを意識しましょう。`;
    }else if(proteinShare > RATIO.protein + 0.06){
      headline = `${nextLabel}はタンパク質多めを意識`;
      body = `残りのタンパク質目安は約${Math.max(Math.round(remaining.protein),0)}gです。サラダチキンやゆで卵、豆腐など高タンパクなメニューを選びましょう。`;
    }else if(fatShare > RATIO.fat + 0.06){
      headline = `${nextLabel}は脂質控えめを意識`;
      body = `残りの脂質目安は約${Math.max(Math.round(remaining.fat),0)}gです。揚げ物やマヨネーズ系は控えて、あっさりしたメニューがおすすめです。`;
    }else{
      headline = `${nextLabel}はこのままのバランスでOK`;
      body = `残り目安: 約${Math.max(Math.round(remaining.kcal),0)}kcal / P${Math.max(Math.round(remaining.protein),0)}g / F${Math.max(Math.round(remaining.fat),0)}g / C${Math.max(Math.round(remaining.carb),0)}g`;
    }
  }

  return { headline, body, remaining, consumed };
}

async function generatePlan(){
  if (!WORKER_URL || WORKER_URL.indexOf('http') !== 0) {
    configWarningEl.style.display = 'block';
    return;
  }

  genBtn.disabled = true;
  const kcal = parseInt(kcalInput.value, 10) || 1700;
  const priceLimit = parseInt(priceInput.value, 10) || 500;
  const targets = computeTargets(kcal);
  outputEl.innerHTML = `<div class="loading">レシート印字中<span class="dots-anim"><span>.</span><span>.</span><span>.</span></span></div>`;

  const consumedSoFar = sumTodayMacros(selectedSlot);
  const remainingKcalForThisMeal = Math.max(targets.kcal - consumedSoFar.kcal, 300);

  const prompt = `あなたは「${selectedStore}」の商品だけを使って、ダイエット中の人のための1食分の食事プランを提案する栄養アドバイザーです。

【ユーザー情報】
- ${PROFILE.age}歳男性、身長${PROFILE.heightCm}cm、体重${PROFILE.weightKg}kg、${PROFILE.goal}
- ${PROFILE.ban}
- 1日の目標: 摂取カロリー約${targets.kcal}kcal、タンパク質約${targets.protein}g、脂質約${targets.fat}g、炭水化物約${targets.carb}g(PFC比 20/25/55%)

【今回の条件】
- 店舗: ${selectedStore}(この店の実在しそうな商品のみを使う。他店の商品は使わない)
- 食事タイミング: ${selectedSlot}
- 予算: ${priceLimit}円以内(必ず守る)
- この食事の目安カロリー: 1日の残り目安を踏まえて${Math.round(remainingKcalForThisMeal / (selectedSlot === '夕食' ? 1 : 2.2))}kcal前後を目安にするが、予算内で無理なく組める範囲でよい
- 高タンパクを意識し、白米は使わない

以下のJSON形式のみで回答してください。前置き・説明・Markdown装飾は一切不要です。

{
  "items": [{"name":"商品名","price":数値,"calories":数値,"protein":数値,"fat":数値,"carbs":数値}],
  "totalPrice": 数値,
  "totalCalories": 数値,
  "totalProtein": 数値,
  "totalFat": 数値,
  "totalCarbs": 数値,
  "tip": "20〜40文字程度の短いアドバイス(この食事についてのコメント)"
}`;

  try{
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, maxTokens: 1000 })
    });

    const data = await response.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');

    const plan = extractJson(data.text);

    const entry = {
      store: selectedStore,
      mealSlot: selectedSlot,
      date: new Date().toLocaleDateString('ja-JP', { month:'2-digit', day:'2-digit', weekday:'short' }),
      time: new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' }),
      items: plan.items,
      totalPrice: plan.totalPrice,
      totalCalories: plan.totalCalories,
      totalProtein: plan.totalProtein,
      totalFat: plan.totalFat,
      totalCarbs: plan.totalCarbs,
      tip: plan.tip,
      priceLimit: priceLimit,
      dailyTargets: targets
    };

    todayLog.date = todayStr();
    todayLog.meals[selectedSlot] = entry;
    saveTodayLog();

    renderReceipt(entry, selectedSlot);
    renderHistory();
  }catch(err){
    console.error(err);
    const detail = (err && err.message) ? err.message : String(err);
    outputEl.innerHTML = `<div class="error-state">レシートを発行できませんでした。<br>もう一度お試しください。<br><span style="font-size:10.5px;opacity:0.7;">(詳細: ${detail})</span></div>`;
  }finally{
    genBtn.disabled = false;
  }
}

function storeBandClass(store){
  if(store.includes('セブン')) return 's7';
  if(store.includes('ローソン')) return 'sL';
  if(store.includes('ファミ')) return 'sF';
  return 's7';
}
function storeColor(store){
  if(store.includes('セブン')) return '#EE7203';
  if(store.includes('ローソン')) return '#0056A8';
  if(store.includes('ファミ')) return '#00A650';
  return '#212A33';
}

function renderReceipt(entry, mealSlot){
  const under = entry.totalPrice <= entry.priceLimit;
  const advice = buildAdvice(entry.dailyTargets, mealSlot);

  outputEl.innerHTML = `
    <div class="receipt-wrap">
      <div class="zigzag-top"></div>
      <div class="receipt">
        <div class="receipt-band ${storeBandClass(entry.store)}"></div>
        ${under ? `<div class="stamp">予算内 OK</div>` : ''}
        <div class="r-store" style="color:${storeColor(entry.store)}">${entry.store}</div>
        <div class="r-meta">
          ${entry.date} ${entry.time} 発行<br>
          <span class="r-day">${mealSlot}</span>
        </div>
        <hr class="r-divider">
        ${entry.items.map(i => `
          <div class="r-item">
            <span class="name">${i.name}</span>
            <span class="dots"></span>
            <span class="price">¥${i.price}</span>
          </div>
        `).join('')}
        <div class="pfc-row">
          <div class="pfc-item"><div class="val">${entry.totalCalories}</div><div class="lbl">kcal</div></div>
          <div class="pfc-item"><div class="val">${entry.totalProtein}g</div><div class="lbl">P たんぱく質</div></div>
          <div class="pfc-item"><div class="val">${entry.totalFat}g</div><div class="lbl">F 脂質</div></div>
          <div class="pfc-item"><div class="val">${entry.totalCarbs}g</div><div class="lbl">C 炭水化物</div></div>
        </div>
        <div class="r-total"><span>合計金額</span><span>¥${entry.totalPrice}</span></div>
        <div class="r-tip" style="font-family:'Noto Sans JP',sans-serif;font-size:12px;line-height:1.6;background:rgba(0,0,0,0.03);border-radius:8px;padding:10px 12px;">
          <b>この食事について:</b> ${entry.tip}
        </div>
        <div class="advice-box">
          <span class="advice-head">${advice.headline}</span>
          ${advice.body}
        </div>
        <div class="barcode"></div>
        <div class="r-thanks">ありがとうございました またお越しください</div>
      </div>
      <div class="zigzag-bottom"></div>
    </div>
  `;
}

clearBtn.addEventListener('click', () => {
  todayLog = { date: todayStr(), meals: {} };
  saveTodayLog();
  renderHistory();
  outputEl.innerHTML = `<div class="empty-state">お店・時間帯・予算を選んで<br>「この食事を発行する」を押してください。</div>`;
});

genBtn.addEventListener('click', generatePlan);

loadTodayLog();
</script>
</body>
</html>
