name: 商品データ更新

# 一時的な調査用(ファミマ詳細ページの構造確認)。調査後に元に戻す
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: ファミマ詳細ページの構造を出力
        run: |
          cat > inspect.py <<'PY'
          import re, sys
          s = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          for kw in ['kcal', '熱量', 'エネルギー', 'たんぱく', '栄養', 'nutrition']:
              for m in list(re.finditer(kw, s))[:2]:
                  print('---', kw, m.start())
                  print(s[max(0, m.start() - 500):m.start() + 500])
          print('--- scripts/api')
          print(set(re.findall(r'(?:src|href)="([^"]+\.(?:js|json)[^"]*)"', s)))
          print(set(re.findall(r'["\'](/[^"\']*(?:api|json|nutri)[^"\']*)["\']', s, re.I)))
          PY
          salad=$(curl -sA "Mozilla/5.0" https://www.family.co.jp/goods/salad.html | grep -o 'goods/salad/[0-9]*\.html' | head -1)
          for u in https://www.family.co.jp/goods/omusubi/0411493.html "https://www.family.co.jp/$salad"; do
            echo "=== $u"
            curl -sA "Mozilla/5.0" "$u" -o page.html
            wc -c page.html
            python3 inspect.py page.html
          done
