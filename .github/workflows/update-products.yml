name: 商品データ更新

on:
  schedule:
    - cron: "17 18 * * 1"  # 毎週火曜 3:17 JST(新商品は火曜発売が多いため)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_products.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data/products.json && git ls-files --error-unmatch data/products.json >/dev/null 2>&1; then
            echo "変更なし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git commit -m "商品データを更新 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push
