name: 商品データ更新

# 一時的な調査用(ファミマ栄養成分の取得元確認)。調査後に元に戻す
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: ファミマのアレルゲン・栄養成分ページを調べる
        run: |
          UA="Mozilla/5.0"
          curl -sA "$UA" https://www.family.co.jp/goods/safety.html -o safety.html
          wc -c safety.html
          echo "=== safety.html 内のリンク"
          grep -o 'href="[^"]*safety[^"]*"' safety.html | sort -u | head -60
          echo "=== goods080.html"
          curl -sA "$UA" https://www.family.co.jp/goods/safety/goods080.html -o g80.html
          wc -c g80.html
          python3 - <<'PY'
          import re
          s = open('g80.html', encoding='utf-8', errors='replace').read()
          for kw in ['kcal', '熱量', '0411493', 'おむすび', '.json', '.csv', '.pdf', 'xlsx']:
              idx = [m.start() for m in re.finditer(re.escape(kw), s)]
              print('---', kw, len(idx))
              for i in idx[:2]:
                  print(s[max(0, i - 400):i + 600])
          PY
