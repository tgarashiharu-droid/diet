name: 商品データ更新

# 一時的な調査用(ファミマ栄養成分の取得元確認)。調査後に元に戻す
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: ファミマの栄養成分の取得元を調べる
        run: |
          UA="Mozilla/5.0"
          curl -sA "$UA" https://www.family.co.jp/goods/omusubi/0411493.html -o page.html
          echo "=== #agn 付近"
          python3 -c "
          s=open('page.html',encoding='utf-8').read()
          i=s.find('id=\"agn\"'); print(s[i-200:i+3000])
          i=s.find('item_nutritional_info'); print('nutri idx',i)
          import re; print(set(re.findall(r'data-[\w-]+=\"[^\"]{0,120}\"', s))) "
          echo "=== goods_detail.js"
          curl -sA "$UA" https://www.family.co.jp/etc/designs/family/component/js/goods_detail.js -o gd.js
          wc -c gd.js
          grep -n -i -E "ajax|\.json|url|fetch|getJSON|agn|nutri|kcal|safety" gd.js | head -80
          echo "=== function.js"
          curl -sA "$UA" https://www.family.co.jp/etc/designs/family/component/js/function.js -o fn.js
          grep -n -i -E "agn|nutri|kcal|safety|getJSON|\.json" fn.js | head -40
